# =============================================================================
# FEU-AGENTIC-FORECASTING - MINIMAL CONFIGURATION
# =============================================================================
#
# This is the simplified config that leverages auto-detection.
# You only need to specify:
#   1. LLM provider
#   2. Data paths
#   3. Core schema (key, timestamp, target columns)
#   4. Time format and forecast horizon
#   5. Train/Val/Test date windows
#
# Feature columns are AUTO-DETECTED from the data by the Feature Availability
# Detection crew. Every column that is not a key, timestamp, or target column
# is analyzed and classified as:
#   - known_in_future: Used directly as model features
#   - history_only: Converted to frozen embeddings (key-level aggregates)
#   - partially_known: Used where available, imputed beyond
#   - excluded: Too sparse to be useful
#
# =============================================================================

# LLM Provider: "bedrock" (AWS Claude, local/AWS) or "databricks" (Databricks AIF)
llm_provider: "bedrock"

# Databricks base path (only used when llm_provider="databricks")
# databricks_base_path: "/Volumes/catalog/schema/path"

# =============================================================================
# DATA PATHS
# =============================================================================
input_data_path: "sourcedata/UK/HOMECARE/homecare_combined_data.csv"
artifact_base_path: "artifacts_homecare"

# =============================================================================
# CORE SCHEMA — Only 3 things needed
# =============================================================================
prediction_key_cols:
  - "key"

timestamp_col: "year_week"
target_col: "psbdl_actual_sales"

# =============================================================================
# TIME FORMAT & HORIZON
# =============================================================================
# Time format: "year_week" (YYYYWW), "year_month" (YYYYMM), "date" (YYYY-MM-DD), or "auto"
time_format: "year_week"
forecast_horizon: 10

# =============================================================================
# TRAIN / VAL / TEST WINDOWS
# =============================================================================
train_start: "202201"
train_end:   "202521"

val_start:   "202522"
val_end:     "202528"

test_start:  "202529"
test_end:    "202537"

# =============================================================================
# DESIGN CONFIGURATION (all optional — sensible defaults used)
# =============================================================================
design:
  # Feature Availability Detection — auto-detect which features are available
  enable_feature_availability_detection: true
  auto_detect_features: true

  # Feature availability thresholds (optional tuning)
  # feature_availability_future_known_threshold: 0.50
  # feature_availability_partial_threshold: 0.10
  # feature_availability_history_min_useful: 0.05

  # Reviewer agent (false = faster, less token usage)
  enable_reviewer: false

  # Model families (auto-selected per segment if omitted)
  # Uncomment to restrict:
  # model_families:
  #   - "lightgbm"
  #   - "xgboost"
  #   - "catboost"

# =============================================================================
# NOTES
# =============================================================================
# - NO numeric_feature_cols needed (auto-detected!)
# - NO price_features needed (auto-detected!)
# - NO promo_features needed (auto-detected!)
# - NO categorical_feature_cols needed (auto-detected!)
# - NO holiday_features needed (auto-detected!)
#
# The Feature Availability Detection crew will:
#   1. Auto-detect history cutoff from the data
#   2. Scan ALL columns in the data
#   3. Classify each as known_in_future / history_only / excluded
#   4. Generate frozen embeddings for history-only features
#   5. Pass the classification to the Feature Engineering crew
#
# If you want to FORCE specific features to be included, you can still
# specify them explicitly (the auto-detection will merge with manual specs):
#
# numeric_feature_cols:
#   - "my_special_feature"
#
# price_features:
#   numeric:
#     - "list_price"
#   categorical: []

  # -------------------------------------------------------------------------
  # Direct Multi-Horizon (upgrade over recursive inference).
  #
  # CATEGORY-AGNOSTIC and MARKET-AGNOSTIC recipe - the ensemble weights are
  # LEARNED from validation data per dataset (dmh_objective='auto'), so this
  # same block works for every UK/DE/TH/DACH category without hand-tuning.
  # See utils/direct_multihorizon.py for the implementation.  Validated on
  # UK DEO/COOKING: beats PristineTVF benchmark on both WMAPE and |bias|
  # after filtering the benchmark's exact-match rows.
  # -------------------------------------------------------------------------
  use_direct_multi_horizon: true
  dmh_objective: "auto"
  dmh_num_leaves: 63
  dmh_learning_rate: 0.05
  dmh_min_data_in_leaf: 200
  dmh_lambda_l2: 1.0
  dmh_num_boost_round: 3000
  dmh_early_stopping_rounds: 150
  dmh_recency_halflife_weeks: 26
  dmh_sply_blend_alpha: 1.0
  dmh_n_seeds: 3
  dmh_top_k_features: 50
  dmh_smooth_window: 1
  dmh_enable_trajectory_features: true
  dmh_enable_apg_features: true
  dmh_enable_forward_features: true
