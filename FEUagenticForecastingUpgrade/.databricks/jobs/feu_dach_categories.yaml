# =============================================================================
# Databricks Job Configuration: FEU DACH Category Pipelines
# =============================================================================
# 10 independent jobs — one per DACH category. Run ALL in parallel.
# Each job runs the full pipeline on the EXISTING shared cluster.
#
# HOW TO DEPLOY (no CLI needed — use Databricks UI):
#
# 1. Go to Databricks → Workflows → Jobs → Create Job
# 2. For each category below:
#    - Name: copy the job name
#    - Task: Spark Python Task
#    - Python file: /Workspace/Repos/<your_email>/FEUagenticForecastingUpgrade/databricks_runner.py
#    - Parameters: copy the parameters list
#    - Cluster: select "eda_stage_cluster_BATCH2" (existing cluster)
# 3. Click Create → Run Now
#
# To run ALL 10 in parallel: just click "Run Now" on each job
# =============================================================================

# CLUSTER: Use existing shared cluster (no new cluster per job)
# Cluster name: eda_stage_cluster_BATCH2
# 64 GB · 16 Cores · DBR 15.4 LTS · Spark 3.5.0 · Scala 2.12

# All jobs use:
#   existing_cluster_id: "<your_cluster_id>"
#   (find it in Compute → eda_stage_cluster_BATCH2 → Advanced → JSON → cluster_id)

resources:
  jobs:

    feu_dach_skincare:
      name: "FEU-DACH-SKIN_CARE"
      description: "Full pipeline for DACH Skin Care (317 keys)"
      max_concurrent_runs: 1
      email_notifications:
        on_start: ["${var.repo_user}"]
        on_success: ["${var.repo_user}"]
        on_failure: ["${var.repo_user}"]
      tasks:
        - task_key: "full_pipeline"
          existing_cluster_id: "${var.cluster_id}"
          spark_python_task:
            python_file: "/Workspace/Repos/${var.repo_user}/FEUagenticForecastingUpgrade/databricks_runner.py"
            parameters:
              - "--config"
              - "/Workspace/Repos/${var.repo_user}/FEUagenticForecastingUpgrade/config/config_de_skincare_databricks.yaml"
              - "--stage"
              - "full"

