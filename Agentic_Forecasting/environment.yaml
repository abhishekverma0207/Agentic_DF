# ============================================================
# FEU-Agentic-Forecasting: Conda Environment
# Agentic AI Demand Forecasting System
# ============================================================
# Usage: conda env create -f environment.yaml
#        conda activate feu-agentic-forecasting
# ============================================================

name: feu-agentic-forecasting
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  - python=3.10
  - pip

  # Install all packages via pip for consistency with requirements.txt
  - pip:
      # -----------------------
      # Core Python dependencies
      # -----------------------
      - pandas>=2.0
      - numpy>=1.26
      - pyarrow>=15.0.0
      - fastparquet>=2024.1.0
      - pyyaml>=6.0
      - tqdm>=4.66

      # -----------------------
      # CrewAI + LLM layer
      # -----------------------
      - crewai>=1.7.2
      - litellm>=1.34.10
      - boto3>=1.34.50
      - botocore>=1.34.50

      # -----------------------
      # Classical Modeling & Statistics
      # -----------------------
      - scikit-learn>=1.4.1
      - scipy>=1.11.0
      - statsmodels>=0.14.2
      - pmdarima>=2.0.4

      # -----------------------
      # Boosting Models
      # -----------------------
      - xgboost>=2.0.3
      - lightgbm>=4.3.0
      - optuna>=3.5.0

      # -----------------------
      # Prophet (time-series)
      # -----------------------
      - prophet>=1.1.4

      # -----------------------
      # Deep Learning Models (TFT, N-BEATS, LSTM)
      # -----------------------
      - torch>=2.2.0
      - torchvision>=0.17.0
      - torchaudio>=2.2.0
      - pytorch-lightning>=2.2.1
      - tensorboard>=2.16.0

      # -----------------------
      # Visualization
      # -----------------------
      - matplotlib>=3.8
      - seaborn>=0.13
      - plotly>=5.14.0
      - openpyxl>=3.1

      # -----------------------
      # Advanced EDA & Analysis
      # -----------------------
      - ruptures>=1.1.7
      - shap>=0.42.0
      - dtaidistance>=2.3.10

      # -----------------------
      # Performance & Optimization
      # -----------------------
      - numba>=0.57.0
      - joblib>=1.4.2

      # -----------------------
      # Utilities
      # -----------------------
      - typing_extensions>=4.10.0
