# =============================================================================
# CORE FORECASTING CONFIG REQUIRED BY DemandForecastConfig
# =============================================================================

# -----------------------------------------------------------------------------
# LLM PROVIDER CONFIGURATION
# -----------------------------------------------------------------------------
# Controls which LLM backend to use for the agentic crews.
# Options:
#   - "bedrock": AWS Bedrock with Claude (default, for local/AWS deployment)
#   - "databricks": Databricks AIF with GPT-5 (for Databricks deployment)
llm_provider: "databricks"

# -----------------------------------------------------------------------------
# DATABRICKS PATH CONFIGURATION
# -----------------------------------------------------------------------------
# Base path for Databricks Unity Catalog Volumes. Only used when llm_provider="databricks".
# When set, input_data_path and artifact_base_path are resolved relative to this base.
#
# Example: "/Volumes/pds_feu_931272_dev/data_science_team/raw_data"
#
# With databricks_base_path set:
#   - input_data_path: "sourcedata/X.csv" → /Volumes/.../sourcedata/X.csv
#   - artifact_base_path: "artifacts"     → /Volumes/.../artifacts
#
# Leave empty ("") to use local filesystem paths (default for bedrock).
databricks_base_path: "/Volumes/pds_feu_931272_dev/data_science_team/us_run/HOMECARE/"

# -----------------------------------------------------------------------------
# DATA PATHS
# -----------------------------------------------------------------------------
# Path to raw input data. Supported formats: CSV, Parquet, Delta table.
#
# Path resolution:
#   - Relative path: resolved against project root (or databricks_base_path)
#     e.g. "sourcedata/sales.csv"
#   - Absolute path: used as-is, can point anywhere on the filesystem
#     e.g. "/mnt/shared/data/sales.parquet"
#   - Home-relative: "~/data/sales.csv" (expanded to full path)
#   - Delta table: path to a directory containing _delta_log/
#     e.g. "/mnt/delta/sales_table"
#   - Databricks Volumes: "/Volumes/catalog/schema/data/sales.parquet"
#
input_data_path: "sourcedata/Home_Care_US.csv"

# Where agentic outputs + model artifacts + final specs will be written
# Same path resolution rules as input_data_path above.
artifact_base_path: "artifacts_base"

# Optional: folder for the final inference forecast Parquet output.
# When set, the inference pipeline writes inference_forecast.parquet here
# in addition to the CSV in model_artifacts/.
# Leave blank or omit to disable. Same path resolution rules apply.
output_folder_path: "/Volumes/pds_feu_931272_dev/data_science_team/us_run/HOMECARE/"

# Keys that define a unique time series
prediction_key_cols:
  - "key"

# Timestamp and target
timestamp_col: "year_week"
target_col: "psbdl_actual_sales"

# Time format interpretation
# - 'year_week' expects YYYYWW-like strings (e.g. 202201, 202521)
time_format: "year_week"

# Extra features available in dataset
numeric_feature_cols:
  - "length_of_0_weeks"
  - "len_after_history_cleaning"
  - "customer_pos_total_number_of_stores"
  - "customer_order_lead_time_in_days"

price_features:
  numeric:
    - "pricing_list_price_per_unit"
    - "pricing_list_price"
    - "combined_pos_price_per_unit"
  categorical: []

promo_features:
  numeric:
    - "bdl_promo_perc_customer_discount_shipment"
    - "bdl_promo_perc_customer_discount_in_store"
    - "bdl_promo_num_days_shipped"
    - "bdl_promo_num_days_in_store"
  categorical:
    - 'bdl_promo_type_group_other_shipment'
    - 'bdl_promo_type_group_other_in_store'
    - 'bdl_promo_type_group_no_display_no_ad_wprice_reduction_shipment'
    - 'bdl_promo_type_group_no_display_no_ad_wprice_reduction_in_store'
    - 'bdl_promo_type_group_ad_no_display_wprice_reduction_shipment'
    - 'bdl_promo_type_group_ad_no_display_wprice_reduction_in_store'
    - 'bdl_promo_type_group_ad_and_display_wprice_reduction_shipment'
    - 'bdl_promo_type_group_ad_and_display_wprice_reduction_in_store'
    - 'bdl_promo_shipment_flag'
    - 'bdl_promo_mechanic_group_price_reduction_shipment'
    - 'bdl_promo_mechanic_group_price_reduction_in_store'
    - 'bdl_promo_mechanic_group_others_shipment'
    - 'bdl_promo_mechanic_group_others_in_store'
    - 'bdl_promo_mechanic_group_no_mechanic_shipment'
    - 'bdl_promo_mechanic_group_no_mechanic_in_store'
    - 'bdl_promo_mechanic_group_multibuy_shipment'
    - 'bdl_promo_mechanic_group_multibuy_in_store'
    - 'bdl_promo_mechanic_group_circular_shipment'
    - 'bdl_promo_mechanic_group_circular_in_store'
    - 'bdl_promo_in_store_flag'
    - 'bdl_promo_display_group_small_shipment'
    - 'bdl_promo_display_group_small_in_store'
    - 'bdl_promo_display_group_no_display_shipment'
    - 'bdl_promo_display_group_no_display_in_store'
    - 'bdl_promo_display_group_medium_shipment'
    - 'bdl_promo_display_group_medium_in_store'
    - 'bdl_promo_display_group_big_shipment'
    - 'bdl_promo_display_group_big_in_store'
    - 'bdl_week_of_promo_in_store'
    - 'bdl_week_of_promo_shipment'
    - 'bdl_short_term_promo_shipment_flag_shipment'
    - 'bdl_short_term_promo_in_store_flag_in_store'
    - 'delist_flag'
    - 'pos_derived_promo_flag'
    - 'bdl_week_of_promo_in_store_group'
    - 'bdl_week_of_promo_shipment_group'

holiday_features:
  numeric: []
  categorical:
    - "holidaylist"

weather_features:
  numeric: []
  categorical: []

categorical_feature_cols:
  - "bdl_planning_customer_code"
  - "bdl_cs_gtin"
  - "psbdl_locallevel3codename"
  - "psbdl_locallevel6codename"
  - "psbdl_locallevel8codename"
  - "accountplanninggroupcode"
  - "delist_flag_product"
  - "delist_flag_key_level"
  - "transition_flag"


# Forecast horizon in number of periods (weeks, since year_week)
forecast_horizon: 10

# Train / Val / Test windows (YYYY-WW format to match source data)
train_start: "202201"
train_end:   "202521"

val_start:   "202522"
val_end:     "202528"

test_start:  "202529"
test_end:    "202537"

# =============================================================================
# DESIGN-TIME CONFIG FOR AGENTIC MULTI-CREW SYSTEM
# =============================================================================
design:
  # -------------------------------------------------------------------------
  # Feature Availability Detection (Phase 1 Enhancement)
  # -------------------------------------------------------------------------
  # Auto-detects which features are available in future forecast periods.
  # Classifies features as known_in_future / history_only / partially_known.
  # Generates frozen embeddings for history-only features.
  enable_feature_availability_detection: true

  # When true, auto-discover feature columns from data (no need to list them).
  # Every column not matching key/timestamp/target is treated as a candidate.
  auto_detect_features: true

  # Thresholds for feature availability classification
  feature_availability_future_known_threshold: 0.50  # Min fill rate for known_in_future
  feature_availability_partial_threshold: 0.10       # Min fill rate for partially_known
  feature_availability_history_min_useful: 0.05      # Min useful rate in history

  # -------------------------------------------------------------------------
  # Reviewer Agent Toggle (TOKEN OPTIMIZATION)
  # -------------------------------------------------------------------------
  # When false (default), skip the reviewer/validation agent in each crew.
  # This reduces token usage significantly and speeds up execution.
  # Set to true for production runs where review/validation is critical.
  enable_reviewer: false

  max_model_candidates_per_group: 5
  max_hparam_search_depth: 30
  max_design_iterations: 2

  crew_timeouts:
    eda: 600
    segmentation: 600
    feature: 900
    training: 10800  # 3 hours - training multiple models per group takes time
    diagnostics: 900

  # -------------------------------------------------------------------------
  # Model Families - Complete list of available forecasting models
  # -------------------------------------------------------------------------
  # Categories:
  #   1. Tree-Based (universal): lightgbm, xgboost, catboost, random_forest
  #   2. Statistical (smooth demand): arima, sarima, ets, theta, tbats
  #   3. Bayesian/Probabilistic: bsts, prophet
  #   4. Intermittent Specialists: croston, sba, tsb, imapa
  #   5. Compound/Hurdle (zero-inflated): zero_inflated, hurdle_model, tweedie
  #   6. Deep Learning: tft, lstm, nbeats, deepar, wavenet
  #   7. Ensemble: weighted_ensemble, stacking
  #
  # Pattern-to-Model Recommendations:
  #   SMOOTH (low CV, low zero%): sarima, ets, prophet, lightgbm, xgboost
  #   ERRATIC (high CV, low zero%): xgboost, lightgbm, theta, bsts
  #   INTERMITTENT (low CV, high zero%): croston, sba, tsb, zero_inflated
  #   LUMPY (high CV, high zero%): hurdle_model, zero_inflated, tsb, imapa
  # -------------------------------------------------------------------------
  model_families:
    # Tree-based / Gradient Boosting (universal - works for all patterns)
    - "lightgbm"
    - "xgboost"
    - "catboost"
    - "random_forest"
    # Classical Statistical (best for smooth/regular demand)
    - "arima"
    - "sarima"
    - "ets"
    - "theta"
    - "tbats"
    # Bayesian / Probabilistic
    - "bsts"
    - "prophet"
    # Intermittent Demand Specialists (for sparse/lumpy demand)
    - "croston"
    - "sba"
    - "tsb"
    - "imapa"
    # Compound / Hurdle Models (two-stage: occurrence + severity)
    - "zero_inflated"
    - "hurdle_model"
    - "tweedie"
    # Deep Learning (controlled by enable_deep_models)
    - "tft"
    - "lstm"
    - "nbeats"
    - "deepar"
    - "wavenet"
    # Ensemble / Meta Methods
    - "weighted_ensemble"
    - "stacking"

  enable_deep_models: false

  # -------------------------------------------------------------------------
  # Diagnostic Metric Levels Configuration
  # -------------------------------------------------------------------------
  # These control how forecast accuracy/WAPE are calculated and reported.
  #
  # abs_error_calc_levels: Additional levels for absolute error calculation
  #   - DEFAULT (always included): key × time_period (most granular)
  #   - Each entry is a list of column names defining aggregation level
  #   - Actuals and predictions are aggregated to this level FIRST, then error computed
  #   - Example: [["subgroup", "year_week"]] computes error at subgroup×week level
  #
  # diagnostic_metric_levels: Additional levels for WAPE/Accuracy metric reporting
  #   - DEFAULT (always included): DISCOVERED from per_key_with_segments.csv
  #     (looks for 'model_group', 'segment_id', 'model_level', or 'cluster' columns)
  #   - Each entry is a list of column names to group by for reporting
  #   - WAPE = sum(|errors|) / sum(actuals) for each group
  #   - Example: [["product_brand_name"]] reports WAPE by brand
  #
  # Outputs produced for each combination:
  #   - wape_errlvl_{error_level}_by_{metric_level}.csv
  #   - chart_errlvl_{error_level}_by_{metric_level}.png
  # -------------------------------------------------------------------------

  # Additional error calculation levels (beyond default key × time_period)
  # Leave empty [] to only use default key × time_period
  abs_error_calc_levels: [["bdl_cs_gtin","year_week"],["bdl_cs_gtin","accountplanninggroupcode","year_week"]]
  # Example with additional levels:
  # abs_error_calc_levels:
  #   - ["cust_planning_customer_code", "year_week"]
  #   - ["product_brand_name", "cust_planning_customer_code", "year_week"]

  # Additional metric aggregation levels (beyond default model grouping column)
  # Leave empty [] to only use the discovered default (model_group/segment_id)
  diagnostic_metric_levels: [["accountplanninggroupcode","psbdl_locallevel3codename"],
                             ["psbdl_locallevel3codename","psbdl_locallevel6codename",],
                             ["psbdl_locallevel3codename","psbdl_locallevel6codename","psbdl_locallevel8codename"]]
  # Example with additional levels:
  # diagnostic_metric_levels:
  #   - ["product_brand_name"]
  #   - ["product_segment_name", "product_brand_name"]
  #   - ["product_segment_name", "product_brand_name", "product_size_pack_name"]
  #   - ["cust_planning_customer_code"]

  # -------------------------------------------------------------------------
  # Backtesting Configuration
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # Validation-Learned Bias Calibration Settings
  # -------------------------------------------------------------------------
  # When enabled, learns calibration factors from validation period and applies
  # them during inference to correct systematic over-forecasting bias.
  # Calibration is learned per (segment_id, zero_fraction_bucket) - ALWAYS at
  # segment level for statistical robustness, even for key-level models.
  # -------------------------------------------------------------------------

  # apply_bias_calibration: Enable/disable the bias calibration system
  # When true, learns correction factors from validation recursive forecasts
  # and applies them during production inference.
  apply_bias_calibration: true

  # bias_calibration_buckets: Number of zero_fraction percentile buckets
  # Keys are grouped by their zero_fraction into N buckets (e.g., 5 = quintiles)
  # Calibration factor is learned per (segment_id, bucket) combination.
  # Range: 2-10, recommended: 5 (quintiles) for balance between granularity and sample size
  bias_calibration_buckets: 5

  # bias_calibration_factor_min: Minimum allowed calibration factor
  # Prevents over-correction that reduces predictions too much.
  # Default 0.2 = predictions won't be reduced by more than 80%
  # Range: 0.01 to 1.0
  bias_calibration_factor_min: 0.5

  # bias_calibration_factor_max: Maximum allowed calibration factor
  # Prevents blow-up that increases predictions too much.
  # Default 2.0 = predictions won't be increased by more than 2x
  # Range: 1.0 to 10.0
  bias_calibration_factor_max: 1.5

  # -------------------------------------------------------------------------
  # Inference Feature Regeneration Settings
  # -------------------------------------------------------------------------
  # Controls whether inference pipeline regenerates features from scratch
  # using the latest data, or uses pre-computed feature files from training.
  # -------------------------------------------------------------------------

  # regenerate_features_on_inference: Regenerate features during inference
  # When true, the inference pipeline will re-compute all features (lags,
  # rolling averages, derived features) using the latest source data up to
  # val_end before retraining models. This ensures features reflect the most
  # recent data available. When false, uses pre-computed feature CSVs from
  # the training pipeline (faster but potentially stale if new data arrived).
  regenerate_features_on_inference: true

  # -------------------------------------------------------------------------
  # Backtesting Feature Regeneration Settings
  # -------------------------------------------------------------------------
  # Controls whether backtesting pipeline regenerates features at each origin
  # point to prevent data leakage from future lag/rolling features.
  # -------------------------------------------------------------------------

  # regenerate_features_on_backtest: Regenerate features at each backtest origin
  # When true, the backtesting pipeline will re-compute all features (lags,
  # rolling averages, derived features) at each origin point using only data
  # available up to that origin's train_cutoff. This prevents data leakage
  # where lag features would otherwise contain "future" information relative
  # to each backtest origin. When false, uses pre-computed feature CSVs
  # (faster but may give optimistically biased backtest accuracy metrics).
  # WARNING: Setting to true significantly increases backtest runtime as
  # features are regenerated for each rolling origin.
  regenerate_features_on_backtest: true

  # -------------------------------------------------------------------------
  # Direct Multi-Horizon (upgrade over recursive inference).
  #
  # CATEGORY-AGNOSTIC and MARKET-AGNOSTIC recipe - the ensemble weights are
  # LEARNED from validation data per dataset (dmh_objective='auto'), so this
  # same block works for every UK/DE/TH/DACH category without hand-tuning.
  # See utils/direct_multihorizon.py for the implementation.  Validated on
  # UK DEO/COOKING: beats PristineTVF benchmark on both WMAPE and |bias|
  # after filtering the benchmark's exact-match rows.
  # -------------------------------------------------------------------------
  use_direct_multi_horizon: true
  dmh_objective: "auto"
  dmh_num_leaves: 63
  dmh_learning_rate: 0.05
  dmh_min_data_in_leaf: 200
  dmh_lambda_l2: 1.0
  dmh_num_boost_round: 3000
  dmh_early_stopping_rounds: 150
  dmh_recency_halflife_weeks: 26
  dmh_sply_blend_alpha: 1.0
  dmh_n_seeds: 3
  dmh_top_k_features: 50
  dmh_smooth_window: 1
  dmh_enable_trajectory_features: true
  dmh_enable_apg_features: true
  dmh_enable_forward_features: true
