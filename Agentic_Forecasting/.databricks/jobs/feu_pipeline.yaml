# =============================================================================
# Databricks Job Configuration: FEU-Agentic-Forecasting Pipeline
# =============================================================================
# Deploy with: databricks bundle deploy
# Or manually create job in Databricks UI using these settings
# =============================================================================

resources:
  jobs:
    # =========================================================================
    # EDA + Segmentation + Feature + Training + Diagnostics + Backtest (6 stages)
    # =========================================================================
    feu_eda_seg_feature_train:
      name: "FEU-Agentic-Forecasting-EDA-Seg-Feature-Train"
      description: "Run EDA, Segmentation, Feature Engineering, Training, Diagnostics, and Backtesting stages sequentially"
      max_concurrent_runs: 1

      # Email notifications
      email_notifications:
        on_start:
          - "${var.repo_user}"
        on_success:
          - "${var.repo_user}"
        on_failure:
          - "${var.repo_user}"
        no_alert_for_skipped_runs: false

      tasks:
        - task_key: "eda_stage"
          description: "Stage 1: Exploratory Data Analysis"
          spark_python_task:
            python_file: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_runner.py"
            parameters:
              - "--config"
              - "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/config/config.yaml"
              - "--stage"
              - "eda"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            # Unity Catalog access - required for /Volumes/ paths
            data_security_mode: "SINGLE_USER"
            single_user_name: "${var.repo_user}"
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"
            custom_tags:
              "project": "feu-agentic-forecasting"
              "stage": "eda"
            init_scripts:
              - workspace:
                  destination: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_init.sh"

          timeout_seconds: 3600  # 1 hour

        - task_key: "segmentation_stage"
          description: "Stage 2: Time Series Segmentation"
          depends_on:
            - task_key: "eda_stage"

          spark_python_task:
            python_file: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_runner.py"
            parameters:
              - "--config"
              - "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/config/config.yaml"
              - "--stage"
              - "segmentation"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            data_security_mode: "SINGLE_USER"
            single_user_name: "${var.repo_user}"
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"
            custom_tags:
              "project": "feu-agentic-forecasting"
              "stage": "segmentation"
            init_scripts:
              - workspace:
                  destination: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_init.sh"

          timeout_seconds: 3600  # 1 hour

        - task_key: "feature_stage"
          description: "Stage 3: Feature Engineering"
          depends_on:
            - task_key: "segmentation_stage"

          spark_python_task:
            python_file: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_runner.py"
            parameters:
              - "--config"
              - "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/config/config.yaml"
              - "--stage"
              - "feature"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            data_security_mode: "SINGLE_USER"
            single_user_name: "${var.repo_user}"
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"
            custom_tags:
              "project": "feu-agentic-forecasting"
              "stage": "feature"
            init_scripts:
              - workspace:
                  destination: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_init.sh"

          timeout_seconds: 5400  # 1.5 hours

        - task_key: "training_stage"
          description: "Stage 4: Model Training"
          depends_on:
            - task_key: "feature_stage"

          spark_python_task:
            python_file: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_runner.py"
            parameters:
              - "--config"
              - "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/config/config.yaml"
              - "--stage"
              - "training"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS4_v2"  # Larger VM for training
            num_workers: 0
            data_security_mode: "SINGLE_USER"
            single_user_name: "${var.repo_user}"
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"
            custom_tags:
              "project": "feu-agentic-forecasting"
              "stage": "training"
            init_scripts:
              - workspace:
                  destination: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_init.sh"

          timeout_seconds: 43200  # 12 hours

        - task_key: "diagnostic_stage"
          description: "Stage 5: Forecast Diagnostics"
          depends_on:
            - task_key: "training_stage"

          spark_python_task:
            python_file: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_runner.py"
            parameters:
              - "--config"
              - "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/config/config.yaml"
              - "--stage"
              - "diagnostic"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            data_security_mode: "SINGLE_USER"
            single_user_name: "${var.repo_user}"
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"
            custom_tags:
              "project": "feu-agentic-forecasting"
              "stage": "diagnostic"
            init_scripts:
              - workspace:
                  destination: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_init.sh"

          timeout_seconds: 5400  # 1.5 hours

        - task_key: "backtest_stage"
          description: "Stage 6: Backtesting"
          depends_on:
            - task_key: "diagnostic_stage"

          spark_python_task:
            python_file: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_runner.py"
            parameters:
              - "--config"
              - "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/config/config.yaml"
              - "--stage"
              - "backtest"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS4_v2"  # Larger VM for backtesting
            num_workers: 0
            data_security_mode: "SINGLE_USER"
            single_user_name: "${var.repo_user}"
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"
            custom_tags:
              "project": "feu-agentic-forecasting"
              "stage": "backtest"
            init_scripts:
              - workspace:
                  destination: "/Workspace/Repos/${var.repo_user}/FEUAgenticForecasting/databricks_init.sh"

