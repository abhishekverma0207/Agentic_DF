# =============================================================================
# Variables (set via databricks.yml or CLI)
# =============================================================================
# NOTE: The repo_user variable is used for both:
#   1. Repos path: /Workspace/Repos/${var.repo_user}/FEUAgenticForecasting
#   2. Email notifications (same email as the repo user)
# This ensures notifications go to whoever owns/runs the job.
# =============================================================================
variables:
  repo_user:
    description: "Databricks username for Repos path AND email notifications (e.g., debonil.chowdhry@unilever.com)"
    default: "debonil.chowdhry@unilever.com"
